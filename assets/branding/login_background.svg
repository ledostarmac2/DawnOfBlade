<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.40" stop-color="#241a38"/>
      <stop offset="0.66" stop-color="#7c3a2c"/>
      <stop offset="0.82" stop-color="#c8703a"/>
      <stop offset="1" stop-color="#f0c46a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffd0a0" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffcaa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="0.5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060c" stop-opacity="0.55"/>
      <stop offset="0.32" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060c" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- Sky + dawn sun -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#sky)"/>
  <circle cx="700" cy="486" r="320" fill="url(#sunGlow)"/>
  <circle cx="700" cy="486" r="64" fill="#ffe1a0"/>

  <!-- Layered mountain silhouettes -->
  <polygon points="0,470 150,420 330,486 520,430 720,500 940,452 1120,500 1280,466 1280,540 0,540" fill="#43395f"/>
  <polygon points="0,520 220,470 430,524 640,486 880,540 1080,498 1280,540 1280,600 0,600" fill="#2a2140"/>

  <!-- Foreground ground ridge -->
  <polygon points="0,566 260,556 540,600 820,576 1080,604 1280,584 1280,720 0,720" fill="#120c18"/>
  <polygon points="0,566 260,556 540,600 820,576 1080,604 1280,584 1280,612 0,612" fill="#1c1426" opacity="0.7"/>

  <!-- ===================== DRAGONS (right) ===================== -->

  <!-- Airborne young dragon, breathing fire toward the warriors -->
  <g transform="translate(980,250)">
    <!-- far wing -->
    <path d="M30,-6 L150,-104 L156,-30 L92,12 Z" fill="#241226"/>
    <!-- tail -->
    <path d="M18,30 Q150,70 232,150 Q150,52 96,40 Z" fill="#1a1020"/>
    <!-- body -->
    <path d="M-92,18 Q-30,-26 60,-8 Q120,8 70,46 Q-10,64 -92,40 Z" fill="#1a1020"/>
    <!-- belly glow -->
    <path d="M-78,34 Q-10,52 60,40 Q-6,58 -78,46 Z" fill="#3a1414"/>
    <!-- near wing -->
    <path d="M6,-2 L-110,-120 L-150,-36 L-58,20 Z" fill="#2c1530"/>
    <path d="M6,-2 L-110,-120 L-72,-44 Z" fill="#3a1a3e" opacity="0.7"/>
    <!-- neck + head facing left -->
    <path d="M-78,18 Q-128,2 -158,-22 L-176,-6 L-156,18 L-120,30 Z" fill="#1a1020"/>
    <!-- horn -->
    <path d="M-150,-20 L-138,-44 L-130,-18 Z" fill="#2c1530"/>
    <!-- jaw / open mouth -->
    <path d="M-176,-6 L-198,2 L-170,14 L-156,12 Z" fill="#241226"/>
    <!-- eye -->
    <circle cx="-150" cy="-6" r="4.5" fill="#ffd24a"/>
    <!-- fire breath toward warriors -->
    <path d="M-196,4 Q-360,-28 -520,70 Q-360,28 -198,16 Z" fill="url(#fire)"/>
    <path d="M-196,6 Q-330,-8 -452,58 Q-330,30 -198,14 Z" fill="#ffd24a" opacity="0.85"/>
  </g>

  <!-- Grounded dragon, mid-right, rearing toward the fight -->
  <g transform="translate(862,540)">
    <path d="M40,-8 L150,-92 L150,-18 L80,18 Z" fill="#241226"/>
    <path d="M150,30 Q40,18 -150,8 Q40,40 96,34 Z" fill="#1a1020"/>
    <path d="M-60,18 Q4,-30 70,-6 Q110,14 64,40 Q-6,56 -60,40 Z" fill="#1a1020"/>
    <path d="M-50,34 Q4,46 60,36 Q2,52 -50,46 Z" fill="#3a1414"/>
    <path d="M-60,16 Q-104,2 -132,-28 L-150,-14 L-128,8 L-92,26 Z" fill="#1a1020"/>
    <path d="M-126,-26 L-116,-48 L-108,-24 Z" fill="#2c1530"/>
    <circle cx="-124" cy="-12" r="4" fill="#ffd24a"/>
  </g>

  <!-- Grounded dragon, far right -->
  <g transform="translate(1118,556) scale(0.92)">
    <path d="M30,-6 L132,-78 L128,-14 L70,16 Z" fill="#241226"/>
    <path d="M-50,16 Q8,-26 66,-6 Q104,12 60,38 Q-4,52 -50,38 Z" fill="#150d1c"/>
    <path d="M120,26 Q36,16 -120,6 Q36,36 86,30 Z" fill="#150d1c"/>
    <path d="M-50,14 Q-92,2 -118,-24 L-134,-12 L-114,8 Z" fill="#150d1c"/>
    <circle cx="-110" cy="-10" r="3.6" fill="#ffb24a"/>
  </g>

  <!-- ===================== WARRIORS (left) ===================== -->

  <!-- Warrior 2 (rear-left, smaller) -->
  <g transform="translate(196,588)">
    <polygon points="-16,0 -4,-92 10,-92 20,0 6,0 1,-44 -4,0" fill="#06060c"/>
    <polygon points="-22,-86 22,-92 14,-150 -14,-148" fill="#06060c"/>
    <polygon points="-2,-150 14,-150 12,-178 0,-182 -8,-172" fill="#06060c"/>
    <!-- raised sword -->
    <polygon points="16,-120 60,-214 66,-210 24,-112" fill="#9aa6bd"/>
    <polygon points="12,-118 28,-118 24,-128 16,-128" fill="#caa64a"/>
    <!-- shield -->
    <ellipse cx="-22" cy="-104" rx="14" ry="22" fill="#14141f"/>
    <ellipse cx="-22" cy="-104" rx="5" ry="6" fill="#caa64a"/>
    <!-- dawn rim light -->
    <polygon points="22,-92 14,-150 17,-150 25,-92" fill="#e8a64a" opacity="0.5"/>
  </g>

  <!-- Warrior 1 (hero, foreground, largest) -->
  <g transform="translate(336,602)">
    <!-- legs in a stance -->
    <polygon points="-30,0 -12,-118 8,-118 -2,0 -16,0 -20,-58 -26,0" fill="#05050b"/>
    <polygon points="8,-118 30,-112 40,-2 24,-2 16,-78" fill="#05050b"/>
    <!-- torso / cloak -->
    <polygon points="-34,-108 30,-118 22,-198 -22,-196 -40,-150" fill="#05050b"/>
    <!-- head + plumed helmet -->
    <polygon points="-10,-198 16,-198 13,-232 -2,-238 -12,-224" fill="#05050b"/>
    <polygon points="-2,-238 10,-262 22,-246 13,-232" fill="#7a1f24"/>
    <!-- raised sword -->
    <polygon points="24,-176 92,-312 100,-308 34,-166" fill="#aab4ca"/>
    <polygon points="86,-300 100,-308 96,-318 84,-312" fill="#e6eefc" opacity="0.8"/>
    <polygon points="18,-172 40,-172 35,-186 23,-186" fill="#caa64a"/>
    <!-- round shield -->
    <ellipse cx="-40" cy="-128" rx="20" ry="32" fill="#161620"/>
    <ellipse cx="-40" cy="-128" rx="7" ry="9" fill="#caa64a"/>
    <!-- dawn rim light along the leading edge -->
    <polygon points="30,-118 22,-198 26,-198 36,-118" fill="#f0b25a" opacity="0.55"/>
    <polygon points="13,-232 -2,-238 1,-244 14,-238" fill="#f0b25a" opacity="0.4"/>
  </g>

  <!-- Warrior 3 (mid, between hero and dragons) -->
  <g transform="translate(484,600)">
    <polygon points="-18,0 -6,-96 10,-96 20,0 6,0 1,-46 -6,0" fill="#06060c"/>
    <polygon points="-24,-90 22,-96 14,-158 -16,-156" fill="#06060c"/>
    <polygon points="-2,-158 14,-158 12,-188 -1,-192 -10,-180" fill="#06060c"/>
    <!-- spear raised -->
    <polygon points="18,-150 26,-262 31,-262 26,-150" fill="#6a4a30"/>
    <polygon points="20,-262 30,-262 25,-286 23,-286" fill="#caa64a"/>
    <!-- shield forward -->
    <ellipse cx="26" cy="-110" rx="13" ry="22" fill="#14141f"/>
    <ellipse cx="26" cy="-110" rx="5" ry="6" fill="#caa64a"/>
    <polygon points="-24,-90 -16,-156 -13,-156 -21,-90" fill="#e8a64a" opacity="0.35"/>
  </g>

  <!-- drifting embers -->
  <g fill="#ffb24a">
    <circle cx="560" cy="300" r="2.4" opacity="0.8"/>
    <circle cx="610" cy="360" r="1.8" opacity="0.6"/>
    <circle cx="500" cy="350" r="1.6" opacity="0.5"/>
    <circle cx="660" cy="250" r="2" opacity="0.7"/>
    <circle cx="430" cy="300" r="1.6" opacity="0.5"/>
    <circle cx="720" cy="330" r="2.2" opacity="0.6"/>
    <circle cx="560" cy="220" r="1.5" opacity="0.5"/>
  </g>

  <!-- readability vignette -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>
</svg>
